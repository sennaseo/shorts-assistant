<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>쇼츠 만들기</title>
<style>
  :root{
    --page:#f2f4ef; --panel:#fff; --text:#111413; --muted:#5d645f; --muted2:#8a918c;
    --vivid:#00d55e; --vivid-press:#00b850; --deep:#0b3d20; --tint:#e3f6e8;
    --yellow-tint:#fff8d6; --yellow-ink:#6b5600; --red:#e5484d; --red-tint:#fde8e8;
    --fill:#f3f5f1; --fill2:#e8ebe5;
    --sh-sm:0 1px 2px rgba(17,20,19,.02), 0 4px 12px rgba(17,20,19,.04);
    --sh-md:0 2px 6px rgba(17,20,19,.03), 0 10px 26px rgba(17,20,19,.06);
    --r-lg:28px; --r-md:24px; --r-sm:14px; --ease:cubic-bezier(.25,.8,.35,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:var(--page);
    color:var(--text); -webkit-font-smoothing:antialiased; letter-spacing:-.02em; min-height:100vh;}
  button,input,select,textarea{font-family:inherit; letter-spacing:inherit; font-size:16px;}
  button{cursor:pointer; border:none; background:none; color:inherit; min-height:44px;}
  :focus-visible{outline:3px solid var(--vivid); outline-offset:2px; border-radius:12px;}
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 120px;}
  header h1{font-size:26px; font-weight:900; letter-spacing:-.045em;}
  header p{font-size:14px; color:var(--muted); font-weight:600; margin-top:4px;}
  nav{display:flex; gap:6px; margin:16px 0 8px; background:var(--fill2); border-radius:999px; padding:4px;}
  nav a{flex:1; text-align:center; text-decoration:none; color:var(--muted); font-weight:800; font-size:14px;
    padding:10px 6px; border-radius:999px; min-height:44px; display:flex; align-items:center; justify-content:center;}
  nav a.on{background:#fff; color:var(--text); box-shadow:var(--sh-sm);}
  .card{background:var(--panel); border-radius:var(--r-md); padding:20px; box-shadow:var(--sh-sm); margin-top:12px;}
  .card h2{font-size:17px; font-weight:900; margin-bottom:12px;}
  .fld{margin-bottom:14px;} .fld label{display:block; font-size:13px; font-weight:800; color:var(--muted); margin-bottom:6px;}
  .fld input[type=text], .fld textarea, .fld select{width:100%; border:none; background:var(--fill); border-radius:var(--r-sm);
    padding:14px; color:var(--text);} .fld textarea{min-height:96px; resize:vertical;}
  .fld input:focus, .fld textarea:focus{background:#fff; box-shadow:0 0 0 2px var(--vivid);}
  .hint{font-size:12px; color:var(--muted2); margin-top:6px;}
  .drop{border:2px dashed #cfd5cf; border-radius:var(--r-sm); padding:18px; text-align:center; color:var(--muted);
    font-weight:700; font-size:14px; cursor:pointer;} .drop input{display:none;}
  .thumb{display:flex; align-items:center; gap:12px;} .thumb img{width:64px; height:64px; object-fit:cover; border-radius:12px;}
  .thumb button{color:var(--red); font-weight:800; font-size:14px;}
  details{margin-top:6px;} summary{cursor:pointer; font-weight:800; font-size:14px; color:var(--muted); padding:10px 0; list-style:none;}
  summary::before{content:'▸ '; } details[open] summary::before{content:'▾ ';}
  .tog{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--fill2);}
  .tog b{font-size:15px;} .tog small{display:block; color:var(--muted2); font-size:12px; margin-top:2px;}
  .tog input{width:24px; height:24px; accent-color:var(--vivid); flex:0 0 auto;}
  .tog.off{opacity:.5;}
  .warn{background:var(--yellow-tint); color:var(--yellow-ink); border-radius:var(--r-sm); padding:10px 12px; font-size:13px; font-weight:700;}
  .chip{display:inline-block; font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--tint); color:var(--deep);}
  .chip.off{background:var(--yellow-tint); color:var(--yellow-ink);}
  .runbar{position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--page) 70%, transparent);}
  .runbar .in{max-width:560px; margin:0 auto;}
  .btn{display:flex; align-items:center; justify-content:center; width:100%; min-height:56px; border-radius:18px;
    font-size:17px; font-weight:900; background:var(--vivid); color:var(--deep); transition:transform .12s var(--ease);}
  .btn:active{transform:scale(.97); background:var(--vivid-press);} .btn[disabled]{background:var(--fill2); color:var(--muted2); cursor:not-allowed;}
  .btn.ghost{background:var(--fill); color:var(--text); min-height:48px; font-size:15px;}
  .btn.sm{width:auto; min-height:40px; padding:0 14px; font-size:14px; border-radius:12px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  /* 진행 체크리스트 */
  .step{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--fill2);}
  .step:first-child{border-top:none;}
  .step .ic{width:40px; height:40px; border-radius:12px; background:var(--fill); display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 40px;}
  .step b{font-size:15px; display:block;} .step small{color:var(--muted2); font-size:12px; display:block; margin-top:2px;}
  .step .st{margin-left:auto; font-size:13px; font-weight:800; color:var(--muted2); white-space:nowrap;}
  .step.running .ic{background:var(--tint); animation:pulse 1.2s ease-in-out infinite;} .step.running .st{color:var(--deep);}
  .step.success .st{color:var(--vivid-press);} .step.error .st{color:var(--red);} .step.skipped{opacity:.55;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .log{font-family:Consolas,monospace; font-size:12px; background:#121413; color:#d5dbd6; border-radius:var(--r-sm); padding:12px; max-height:240px; overflow:auto; white-space:pre-wrap;}
  .log .warn{color:#ffe14d;} .log .err{color:#ff7b7b;} .log .ok{color:#7dffb0;}
  .err-card{background:var(--red-tint); color:var(--red);}
  /* 결과 */
  .script{width:100%; min-height:160px; background:var(--fill); border:none; border-radius:var(--r-sm); padding:14px; line-height:1.6;}
  audio, video{width:100%; border-radius:var(--r-sm); margin-top:8px;} video{max-height:60vh; background:#000;}
  .sec{margin-bottom:14px;} .sec h3{font-size:13px; font-weight:800; color:var(--muted); margin-bottom:6px;}
  .sec pre{white-space:pre-wrap; background:var(--fill); border-radius:var(--r-sm); padding:12px; font-family:inherit; font-size:14px; line-height:1.55;}
  .files a{display:flex; justify-content:space-between; padding:12px 0; border-top:1px solid var(--fill2); text-decoration:none; color:var(--text); font-weight:700; font-size:14px; min-height:44px; align-items:center;}
  .files a small{color:var(--muted2); font-weight:600;}
  .hist{display:block; text-decoration:none; color:inherit; padding:14px 0; border-top:1px solid var(--fill2); min-height:44px;}
  .hist b{font-size:15px;} .hist small{display:block; color:var(--muted2); font-size:12px; margin-top:3px;}
  .empty{color:var(--muted2); text-align:center; padding:30px 0; font-weight:700;}
  #toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px); background:#121413; color:#fff;
    padding:12px 18px; border-radius:999px; font-weight:800; font-size:14px; opacity:0; transition:all .25s var(--ease); pointer-events:none;}
  #toast.show{opacity:1; transform:translateX(-50%);}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>쇼츠 만들기</h1>
    <p>제품 정보만 넣으면 대본·음성·영상·업로드 문구까지 만들어 드려요</p>
  </header>
  <nav>
    <a href="#make" id="tab-make" class="on">쇼츠 만들기</a>
    <a href="#history" id="tab-history">지난 제작</a>
    <a href="/image" id="tab-image">이미지 생성</a>
  </nav>

  <!-- 화면 A: 입력 -->
  <section id="scr-make">
    <div class="card">
      <h2>① 제품 정보</h2>
      <div class="fld"><label for="f-name">제품명 (필수)</label>
        <input id="f-name" type="text" placeholder="예: 무선 이어폰 X1" autofocus autocomplete="off"></div>
      <div class="fld"><label for="f-cat">카테고리</label>
        <input id="f-cat" type="text" placeholder="예: 전자기기"></div>
      <div class="fld"><label for="f-feat">특징</label>
        <textarea id="f-feat" placeholder="핵심 장점을 자유롭게 적어주세요 (예: 보온 12시간, 500ml)"></textarea></div>
      <div class="fld"><label>제품 사진 (선택)</label>
        <label class="drop" id="drop">📷 사진 찍기 또는 앨범에서 선택 <input id="f-image" type="file" accept="image/*"></label>
        <div class="thumb" id="img-preview" hidden><img alt="제품 사진 미리보기"><span></span><button type="button" id="img-remove">삭제</button></div>
        <div class="hint">사진이 있으면 AI 영상(힉스필드)을 만들 수 있어요</div></div>
      <details id="opts">
        <summary>옵션 펼치기 <span id="opt-chips"></span></summary>
        <div class="tog"><div><b>음성 만들기</b><small>대본을 읽어주는 mp3 (<span id="tts-engine">Edge TTS</span>)</small></div>
          <input type="checkbox" id="opt-tts" checked></div>
        <div class="fld"><label for="f-voice">목소리</label><select id="f-voice">
          <option value="ko-KR-SunHiNeural">여성 (SunHi)</option><option value="ko-KR-InJoonNeural">남성 (InJoon)</option></select></div>
        <div class="fld"><label for="f-rate">말하기 속도</label><select id="f-rate">
          <option value="-10%">느리게</option><option value="+0%" selected>보통</option><option value="+10%">빠르게</option></select></div>
        <div class="tog"><div><b>초안 영상(mp4) 만들기</b><small>이미지 슬라이드 + 음성, 수십 초 걸려요</small></div>
          <input type="checkbox" id="opt-render"></div>
        <div class="tog" id="higgs-row"><div><b>AI 영상 만들기 (힉스필드)</b><small id="higgs-note">클립 1개 ≈ 9크레딧(약 780원) 차감</small></div>
          <input type="checkbox" id="opt-higgs"></div>
      </details>
    </div>
  </section>

  <!-- 화면 B: 진행 -->
  <section id="scr-progress" hidden>
    <div class="card"><h2>만드는 중…</h2><p id="run-summary" class="hint"></p>
      <div id="steps"></div>
      <details id="log-box"><summary>자세한 로그</summary><div class="log" id="log-list"></div></details>
    </div>
    <div class="card err-card" id="err-card" hidden><b>문제가 생겼어요</b><p id="err-msg"></p>
      <div class="row"><button class="btn ghost" id="btn-retry" type="button">처음으로</button></div></div>
  </section>

  <!-- 화면 C: 결과 (Task 5가 채움) -->
  <section id="scr-result" hidden><div id="result-body"></div></section>

  <!-- 지난 제작 (Task 5가 채움) -->
  <section id="scr-history" hidden><div class="card"><h2>지난 제작</h2><div id="history-list"></div></div></section>
</div>

<div class="runbar" id="runbar"><div class="in"><button class="btn" id="btn-run" type="button" disabled>제작 시작</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ── 유틸 ── */
const $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
let toastT; function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 1800); }
function copyText(text){
  return navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text).then(function(){ toast('복사했어요'); })
    : new Promise(function(res){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); toast('복사했어요'); res(); });
}
function api(path, opts){ return fetch(path, opts).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); }); }

/* ── 화면 전환: make | progress | result | history ── */
const SCREENS = ['make', 'progress', 'result', 'history'];
function showScreen(name){
  SCREENS.forEach(function(s){ $('scr-' + s).hidden = (s !== name); });
  $('runbar').hidden = (name !== 'make');
  $('tab-make').classList.toggle('on', name !== 'history');
  $('tab-history').classList.toggle('on', name === 'history');
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
function route(){
  if(location.hash === '#history'){ showHistory(); }
  else if(location.hash.indexOf('#run=') === 0){ showResult(location.hash.slice(5)); }
  else { showScreen('make'); }
}

/* ── 서버 상태 ── */
let health = {local:false, gpt_available:false, higgsfield_available:false, voicebox_available:false};
api('/api/health').then(function(h){
  health = h;
  $('tts-engine').textContent = h.voicebox_available ? 'Voicebox' : 'Edge TTS';
  $('opt-chips').innerHTML = '<span class="chip' + (h.gpt_available ? '' : ' off') + '">' + (h.gpt_available ? 'GPT 대본' : '템플릿 대본') + '</span>';
  $('higgs-row').hidden = !h.higgsfield_available;
  syncHiggs();
}).catch(function(){ toast('서버에 연결할 수 없어요'); });

/* ── 입력: 이미지 업로드 ── */
let imageId = '';
$('f-image').onchange = function(){
  const file = this.files && this.files[0]; if(!file) return;
  fetch('/api/upload-image?name=' + encodeURIComponent(file.name), {method:'POST', body:file})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j.error) throw new Error(j.error);
      imageId = j.image_id;
      const pv = $('img-preview'); pv.querySelector('img').src = URL.createObjectURL(file);
      pv.querySelector('span').textContent = file.name; pv.hidden = false; $('drop').hidden = true; syncHiggs();
    }).catch(function(e){ toast('업로드 실패: ' + e.message); });
};
$('img-remove').onclick = function(){ imageId = ''; $('f-image').value = ''; $('img-preview').hidden = true; $('drop').hidden = false; syncHiggs(); };
function syncHiggs(){
  const cb = $('opt-higgs'), row = $('higgs-row');
  cb.disabled = !imageId; if(!imageId) cb.checked = false;
  row.classList.toggle('off', !imageId);
  $('higgs-note').textContent = imageId ? '클립 1개 ≈ 9크레딧(약 780원) 차감' : '제품 사진을 먼저 올려야 켤 수 있어요';
}
$('f-name').oninput = function(){ $('btn-run').disabled = !this.value.trim(); };

/* ── 실행 ── */
$('btn-run').onclick = function(){
  const payload = {
    products: [{product_name: $('f-name').value.trim(), category: $('f-cat').value.trim(), features: $('f-feat').value.trim()}],
    options: {engine: 'gpt', tts: $('opt-tts').checked, voice: $('f-voice').value, rate: $('f-rate').value,
              render: $('opt-render').checked, higgsfield: $('opt-higgs').checked, image_id: imageId}
  };
  startRun(payload);
};
function startRun(payload){
  $('btn-run').disabled = true;
  api('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
    .then(function(j){
      $('run-summary').textContent = payload.products[0].product_name;
      beginProgress(payload.options);
      followRun(j.run_id, function(done){ if(done.ok) showResult(done.summary.run_id); else showError(done.error); });
    }).catch(function(e){ $('btn-run').disabled = false; toast(e.message); });
}

/* ── 진행 체크리스트: 서버 노드 → 표시 단계 ── */
const STEPS = [
  {id:'script', icon:'✍️', label:'대본 쓰기', nodes:['script','quality'], sub:'GPT가 대본을 쓰고 품질을 검사해요'},
  {id:'tts',    icon:'🔊', label:'음성 만들기', nodes:['tts','subtitle'], sub:'음성 + 자막(SRT)'},
  {id:'uptext', icon:'📝', label:'업로드 문구', nodes:['uptext'], sub:'제목·설명·해시태그'},
  {id:'higgs',  icon:'🎥', label:'AI 영상', nodes:['higgsfield'], sub:'힉스필드 image-to-video'},
  {id:'render', icon:'🎬', label:'초안 영상', nodes:['render'], sub:'이미지 슬라이드 + 음성 mp4'}
];
const ST_LABEL = {running:'진행 중', success:'완료', error:'실패', skipped:'건너뜀', simulated:'완료', wait:'대기'};
let nodeState = {};
function beginProgress(options){
  nodeState = {}; $('log-list').innerHTML = ''; $('err-card').hidden = true;
  if(!options.tts) nodeState.tts = {status:'skipped', note:'옵션 꺼짐'};
  if(!options.render) nodeState.render = {status:'skipped', note:'옵션 꺼짐'};
  if(!options.higgsfield) nodeState.higgsfield = {status:'skipped', note:'옵션 꺼짐'};
  renderProgress(nodeState); showScreen('progress');
}
function stepStatus(step){
  const sts = step.nodes.map(function(n){ return nodeState[n] && nodeState[n].status; });
  if(sts.some(function(s){ return s === 'error'; })) return 'error';
  if(sts.some(function(s){ return s === 'running'; })) return 'running';
  if(sts.every(function(s){ return s === 'success' || s === 'simulated'; })) return 'success';
  if(sts[0] === 'skipped') return 'skipped';
  if(sts.some(function(s){ return s; })) return 'running';
  return 'wait';
}
function renderProgress(){
  $('steps').innerHTML = STEPS.map(function(s){
    const st = stepStatus(s);
    const note = s.nodes.map(function(n){ return nodeState[n] && nodeState[n].note; }).filter(Boolean).pop() || s.sub;
    return '<div class="step ' + st + '"><div class="ic">' + s.icon + '</div><div><b>' + s.label + '</b><small>' + esc(note) + '</small></div>' +
           '<span class="st">' + ST_LABEL[st] + '</span></div>';
  }).join('');
}
function followRun(runId, onDone){
  try{ sessionStorage.setItem('currentRun', runId); }catch(e){}
  const es = new EventSource('/api/events/' + runId);
  es.onmessage = function(ev){
    const d = JSON.parse(ev.data);
    if(d.type === 'node'){ nodeState[d.node] = {status:d.status, note:d.note}; renderProgress(); }
    else if(d.type === 'log'){ const l = $('log-list'); l.innerHTML += '<div class="' + d.level + '">' + esc(d.msg) + '</div>'; l.scrollTop = l.scrollHeight; }
    else if(d.type === 'done'){ es.close(); try{ sessionStorage.removeItem('currentRun'); }catch(e){} onDone(d); }
  };
  es.onerror = function(){ es.close(); showError('서버와 연결이 끊겼어요. 지난 제작에서 결과를 확인해 보세요.'); };
}
function showError(msg){ $('err-msg').textContent = msg || '알 수 없는 오류'; $('err-card').hidden = false; $('btn-run').disabled = false; }
$('btn-retry').onclick = function(){ location.hash = ''; showScreen('make'); };

/* Task 5에서 채움 */
function showResult(runId){ location.hash = '#run=' + runId; }
function showHistory(){ showScreen('history'); }

route();
</script>
</body>
</html>
