<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts 제작 — 6단계</title>
<style>
  :root{
    --page:#f2f4ef; --canvas:#f2f4ef;
    --panel:#ffffff;
    --text:#111413; --muted:#5d645f; --muted2:#8a918c;
    --vivid:#00d55e; --vivid-press:#00b850; --deep:#0b3d20; --tint:#e3f6e8;
    --black:#121413;
    --yellow:#ffe14d; --yellow-tint:#fff8d6; --yellow-ink:#6b5600;
    --red:#e5484d; --red-tint:#fde8e8;
    --fill:#f3f5f1; --fill2:#e8ebe5;
    --sh-sm:0 1px 2px rgba(17,20,19,.02), 0 4px 12px rgba(17,20,19,.04);
    --sh-md:0 2px 6px rgba(17,20,19,.03), 0 10px 26px rgba(17,20,19,.06);
    --r-lg:28px; --r-md:24px; --r-sm:14px;
    --ease:cubic-bezier(.25,.8,.35,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:var(--page);
    color:var(--text); -webkit-font-smoothing:antialiased; letter-spacing:-.02em;
    display:flex; flex-direction:column; overflow:hidden;}
  button,input,select,textarea{font-family:inherit; letter-spacing:inherit;}
  button{cursor:pointer; border:none; background:none; color:inherit;}
  :focus-visible{outline:3px solid var(--vivid); outline-offset:2px; border-radius:16px;}

  /* ══ 헤더 ══ */
  header{flex:0 0 auto; display:flex; align-items:center; gap:16px; padding:24px 28px 16px;}
  header .logo{width:52px; height:52px; border-radius:18px; flex:0 0 52px;
    background:var(--vivid); display:flex; align-items:center;
    justify-content:center; font-size:25px;}
  header .title{font-size:26px; font-weight:900; letter-spacing:-.045em; line-height:1.15;}
  header .sub{font-size:13px; color:var(--muted); margin-top:4px; font-weight:600;}
  .hchips{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .hchip{font-size:12px; font-weight:800; padding:9px 16px; border-radius:999px; background:#fff;
    color:var(--muted); display:flex; align-items:center; gap:7px; white-space:nowrap;}
  .hchip .dot{width:7px; height:7px; border-radius:50%; background:var(--muted2); display:inline-block;}
  .hchip.on{background:var(--tint); color:var(--deep);} .hchip.on .dot{background:var(--vivid);}
  .hchip.off{background:var(--yellow-tint); color:var(--yellow-ink);} .hchip.off .dot{background:#e0b400;}

  /* ══ 본문 ══ */
  main{flex:1; min-height:0; overflow-y:auto; padding:10px 28px 140px;}

  /* ══ n8n 스타일 노드 캔버스 ══ */
  #canvas-wrap{position:relative; max-width:1180px; margin:22px auto 0; height:520px;
    background:#f7f8f6; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--sh-sm);
    background-image:radial-gradient(circle, #d3d8d1 1.1px, transparent 1.1px);
    background-size:22px 22px; cursor:grab; touch-action:none;}
  #canvas-wrap.panning{cursor:grabbing;}
  #canvas{position:absolute; top:0; left:0; width:1px; height:1px; transform-origin:0 0;}
  #edges{position:absolute; top:0; left:0; width:2000px; height:900px; overflow:visible;
    pointer-events:none;}
  .edge{fill:none; stroke:#b9beba; stroke-width:2.2; marker-end:url(#arrow);}
  .edge.done{stroke:var(--vivid); marker-end:url(#arrow-on);}
  .edge.running{stroke:var(--vivid); stroke-dasharray:7 6; marker-end:url(#arrow-on);
    animation:ants .6s linear infinite;}
  @keyframes ants{to{stroke-dashoffset:-13;}}
  .dep-edge{fill:none; stroke:#c2c7c3; stroke-width:1.8; stroke-dasharray:5 5;}
  .dep-edge.on{stroke:#8fd9ab;}

  /* 메인 노드 */
  .node{position:absolute; width:112px; cursor:pointer; user-select:none;
    display:flex; flex-direction:column; align-items:center;
    animation:cardin .45s var(--ease) both;}
  @keyframes cardin{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  .node.no-anim{animation:none;}
  .node .box{width:96px; height:96px; border-radius:18px; background:#fff; border:1px solid #e0e4df;
    box-shadow:var(--sh-sm); display:flex; align-items:center; justify-content:center;
    position:relative; transition:transform .18s var(--ease), box-shadow .18s var(--ease),
    border-color .18s var(--ease);}
  .node:hover .box{transform:translateY(-3px); box-shadow:var(--sh-md); border-color:#c7cec8;}
  .node:active .box{transform:translateY(0) scale(.96);}
  .node.selected .box{border-color:var(--vivid); box-shadow:0 0 0 3px rgba(0,213,94,.35), var(--sh-md);}
  .node .tile{width:52px; height:52px; border-radius:15px; display:flex; align-items:center;
    justify-content:center; font-size:26px; background:var(--tile,#eef1ec);}
  .node.st-running .tile{animation:pulse 1.3s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(0,213,94,.45);}
    50%{box-shadow:0 0 0 12px rgba(0,213,94,0);}
  }
  .node.st-skipped .box{opacity:.6;}
  .node .bolt{position:absolute; left:-22px; top:50%; transform:translateY(-50%); font-size:16px;
    filter:hue-rotate(-15deg);}
  /* 노드 우상단 개별 실행 배지 (n8n Execute node) — hover/focus 시에만 노출 */
  .node .play{position:absolute; top:-9px; right:-9px; width:26px; height:26px; border-radius:50%;
    background:var(--vivid); color:var(--black); font-size:11px; line-height:1; display:flex;
    align-items:center; justify-content:center; box-shadow:var(--sh-sm); z-index:2;
    opacity:0; transform:scale(.7); pointer-events:none;
    transition:opacity .16s var(--ease), transform .16s var(--ease), background .16s var(--ease);}
  .node:hover .play, .node:focus-within .play, .node .play:focus-visible{
    opacity:1; transform:scale(1); pointer-events:auto;}
  .node .play:hover{background:var(--vivid-press);}
  .node .play:active{transform:scale(.9);}
  .node .nm{margin-top:9px; font-size:13px; font-weight:800; letter-spacing:-.035em;
    text-align:center; line-height:1.3;}
  .node .sub{margin-top:2px; font-size:10.5px; font-weight:700; color:var(--muted2);
    text-align:center; line-height:1.3;}
  .node .engine{margin-top:4px; font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px;
    background:var(--tint); color:var(--deep); white-space:nowrap;}

  /* 상태 칩 (ref 10) */
  .node .chip{margin-top:6px; font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:999px;
    background:var(--fill); color:var(--muted); display:flex; align-items:center; gap:5px;
    white-space:nowrap;}
  .node .chip::before{content:'●'; font-size:8px; line-height:1;}
  .node.st-running .chip{background:var(--black); color:#fff;}
  .node.st-running .chip::before{color:var(--vivid); animation:dotpulse 1.1s ease-in-out infinite;}
  @keyframes dotpulse{0%,100%{opacity:1;} 50%{opacity:.25;}}
  .node.st-done .chip{background:var(--tint); color:var(--deep);}
  .node.st-done .chip::before{content:'✓'; font-size:10px;}
  .node.st-error .chip{background:var(--red); color:#fff;}
  .node.st-skipped .chip{opacity:.65;}

  /* 의존 서브노드 (ref 7) */
  .dep{position:absolute; width:96px; display:flex; flex-direction:column; align-items:center;
    user-select:none;}
  .dep .circ{width:56px; height:56px; border-radius:50%; background:#fff; border:1px solid #e0e4df;
    box-shadow:var(--sh-sm); display:flex; align-items:center; justify-content:center;
    font-size:22px; position:relative;}
  .dep.off{opacity:.5;}
  .dep .sdot{position:absolute; top:1px; right:1px; width:11px; height:11px; border-radius:50%;
    background:var(--muted2); border:2px solid #fff;}
  .dep.on .sdot{background:var(--vivid);}
  .dep .dnm{margin-top:7px; font-size:11px; font-weight:800; text-align:center; line-height:1.25;
    letter-spacing:-.03em;}
  .dep .drole{margin-top:1px; font-size:9.5px; font-weight:700; color:var(--muted2);}

  /* 엣지 라벨 칩 (ref 4 YES/NO 느낌) */
  .elabel{position:absolute; font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px;
    background:#fff; border:1px solid #e0e4df; color:var(--muted); white-space:nowrap;
    transform:translate(-50%,-50%); pointer-events:none;}
  .elabel.ok{background:var(--tint); border-color:#bfe6cc; color:var(--deep);}

  /* 캔버스 컨트롤 */
  #cv-ctl{position:absolute; left:14px; bottom:14px; display:flex; gap:6px; z-index:5;}
  #cv-ctl button{width:34px; height:34px; border-radius:11px; background:#fff; border:1px solid #e0e4df;
    font-size:14px; font-weight:900; color:var(--muted); display:flex; align-items:center;
    justify-content:center; box-shadow:var(--sh-sm);
    transition:background .16s var(--ease), color .16s var(--ease);}
  #cv-ctl button:hover{background:var(--tint); color:var(--deep);}
  #cv-ctl .zval{width:auto; padding:0 12px; cursor:default; font-size:11.5px;}
  #cv-hint{position:absolute; right:14px; bottom:14px; font-size:11px; font-weight:700;
    color:var(--muted2); z-index:5; pointer-events:none;}

  @media (max-width:900px){ #canvas-wrap{height:440px;} }

  /* 로그 접이식 — 터미널 느낌 블랙 카드 */
  #logbox{max-width:1180px; margin:26px auto 0; background:var(--black); border-radius:var(--r-lg);
    overflow:hidden;}
  #log-toggle{width:100%; display:flex; align-items:center; gap:9px; padding:18px 24px;
    font-size:14px; font-weight:800; color:#c9d3cc; letter-spacing:-.03em;
    transition:color .18s var(--ease);}
  #log-toggle:hover{color:var(--vivid);}
  #log-toggle .arw{margin-left:auto; font-size:10px; color:var(--vivid);
    transition:transform .22s var(--ease);}
  #logbox.open #log-toggle .arw{transform:rotate(90deg);}
  #log-list{display:none; max-height:260px; overflow-y:auto; padding:2px 24px 20px;
    font-family:Consolas,'D2Coding',monospace; font-size:12.5px; line-height:1.85; letter-spacing:0;}
  #logbox.open #log-list{display:block;}
  .log-line{color:#a9b7ad; white-space:pre-wrap; word-break:break-word;}
  .log-ok{color:var(--vivid);} .log-err{color:#ff7b7f;} .log-warn{color:var(--yellow);} .log-info{color:#8fe0ff;}

  /* ══ 사이드바 ══ */
  #scrim{position:fixed; inset:0; background:rgba(11,61,32,.28); z-index:80; opacity:0;
    pointer-events:none; transition:opacity .26s var(--ease);}
  #scrim.open{opacity:1; pointer-events:auto;}
  #side{position:fixed; top:12px; right:12px; bottom:12px; width:392px; max-width:94vw;
    background:var(--panel); border-radius:var(--r-lg);
    z-index:90; display:flex; flex-direction:column; transform:translateX(106%);
    transition:transform .3s var(--ease); box-shadow:0 18px 60px rgba(17,20,19,.18);}
  #side.open{transform:none;}
  #s-head{padding:24px 24px 14px; display:flex; align-items:flex-start; gap:14px;}
  #s-icon{width:52px; height:52px; border-radius:50%; background:var(--tint); color:var(--deep);
    display:flex; align-items:center; justify-content:center; font-size:23px; font-weight:900;
    flex:0 0 52px;}
  #s-name{font-size:21px; font-weight:900; letter-spacing:-.045em; line-height:1.25;}
  #s-status{font-size:12px; padding:6px 14px; border-radius:999px; display:inline-block; margin-top:9px;
    background:var(--fill); color:var(--muted); font-weight:800;}
  #s-status.st-running{background:var(--black); color:#fff;}
  #s-status.st-done{background:var(--vivid); color:var(--black);}
  #s-status.st-error{background:var(--red); color:#fff;}
  #s-close{margin-left:auto; font-size:16px; color:var(--muted); width:38px; height:38px; flex:0 0 38px;
    border-radius:50%; background:var(--fill);
    transition:background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);}
  #s-close:hover{background:var(--black); color:#fff;}
  #s-close:active{transform:scale(.92);}
  #s-body{flex:1; overflow-y:auto; padding:0 24px 28px;}

  .note{background:var(--fill); border-radius:18px; padding:16px 18px; font-size:13px;
    color:var(--muted); line-height:1.65; font-weight:600; margin-bottom:14px;}
  .note.err{background:var(--red-tint); color:#a12b2f;}
  .sec-t{font-size:11.5px; font-weight:900; color:var(--muted); margin:22px 0 10px;
    text-transform:uppercase; letter-spacing:.06em;}
  .sec-t:first-child{margin-top:4px;}

  .fld{margin-bottom:12px;}
  .fld label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:700;}
  .fld input,.fld select,.fld textarea{width:100%; background:var(--fill); border:none; border-radius:16px;
    color:var(--text); font-size:14.5px; font-weight:700; padding:15px 17px; outline:none; resize:vertical;
    box-shadow:0 0 0 0 var(--vivid);
    transition:background .2s var(--ease), box-shadow .18s var(--ease);}
  .fld textarea{min-height:92px; line-height:1.55;}
  .fld input::placeholder,.fld textarea::placeholder{color:var(--muted2); font-weight:600;}
  .fld input:focus,.fld select:focus,.fld textarea:focus{background:#fff; box-shadow:0 0 0 2px var(--vivid);}
  .fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{outline:none;}

  /* iOS 스타일 스위치 */
  .tog{display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:18px;
    margin-bottom:10px; cursor:pointer; user-select:none; background:var(--fill);
    transition:background .18s var(--ease), transform .12s var(--ease), opacity .18s var(--ease);}
  .tog:hover{background:var(--fill2);}
  .tog:active{transform:scale(.99);}
  .tog.disabled{opacity:.45; cursor:not-allowed;}
  .tog input{appearance:none; -webkit-appearance:none; width:46px; height:28px; flex:0 0 46px;
    border-radius:999px; background:#c9cfc9; position:relative; cursor:pointer; order:2;
    margin-left:auto; transition:background .22s var(--ease);}
  .tog input::after{content:''; position:absolute; top:3px; left:3px; width:22px; height:22px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(17,20,19,.25);
    transition:transform .22s var(--ease);}
  .tog input:checked{background:var(--vivid);}
  .tog input:checked::after{transform:translateX(18px);}
  .tog input:disabled{cursor:not-allowed;}
  .tog input:focus-visible{outline:3px solid var(--deep); outline-offset:2px;}
  .tog > div{order:1; min-width:0;}
  .tog .tt{font-size:14.5px; font-weight:800; letter-spacing:-.03em;}
  .tog .td{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45; font-weight:600;}

  .warn-box{background:var(--yellow-tint); border-radius:18px; padding:16px 18px; font-size:13px;
    color:var(--yellow-ink); line-height:1.6; margin-bottom:12px; font-weight:600;}
  .warn-box b{color:#4d3d00; font-weight:900;}

  .drop{border:2px dashed #d3d9d2; border-radius:18px; padding:24px; text-align:center; font-size:13.5px;
    font-weight:700; color:var(--muted); cursor:pointer; background:var(--fill); width:100%;
    transition:border-color .18s var(--ease), color .18s var(--ease), background .18s var(--ease), transform .12s var(--ease);}
  .drop:hover{border-color:var(--vivid); color:var(--deep); background:var(--tint);}
  .drop:active{transform:scale(.99);}
  .drop.has{border-style:solid; border-color:var(--vivid); color:var(--deep); background:var(--tint);}

  .btn{font-size:14.5px; font-weight:800; padding:15px 22px; border-radius:999px; background:var(--tint);
    color:var(--deep); white-space:nowrap; letter-spacing:-.03em;
    transition:background .18s var(--ease), transform .12s var(--ease), color .18s var(--ease);}
  .btn:hover{background:#d3efdb;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--black); color:#fff;}
  .btn-primary:hover{background:#2a302c;}
  .btn-full{width:100%;}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}

  .scriptbox{background:var(--fill); border-radius:18px; padding:16px 18px; font-size:13px;
    line-height:1.75; color:#333a35; white-space:pre-wrap; word-break:break-word; margin-bottom:10px;
    font-weight:600;}
  .item-tag{font-size:11.5px; color:var(--muted); font-weight:900; margin:16px 0 8px;}
  .pill{font-size:11px; font-weight:800; padding:5px 11px; border-radius:999px; margin-left:6px;}
  .pill.ok{background:var(--vivid); color:var(--black);}
  .pill.no{background:var(--red); color:#fff;}
  audio,video{width:100%; border-radius:16px; margin-bottom:10px; background:#000;}
  audio{background:var(--fill);}
  .filelist a{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:700; color:var(--deep);
    text-decoration:none; padding:13px 15px; border-radius:var(--r-sm); background:var(--fill); margin-bottom:6px;
    transition:background .18s var(--ease), transform .12s var(--ease);}
  .filelist a:hover{background:var(--tint);}
  .filelist a:active{transform:scale(.985);}
  .filelist a .sz{margin-left:auto; color:var(--muted); font-size:11.5px; font-weight:600;}
  .empty{font-size:13px; color:var(--muted); line-height:1.6; font-weight:600; padding:10px 2px;}

  /* ══ 하단 실행 바 ══ */
  #runbar{position:fixed; left:0; right:0; bottom:0; z-index:70; display:flex; align-items:center;
    gap:18px; padding:18px 28px; background:rgba(242,244,239,.92); backdrop-filter:blur(10px);}
  #btn-run{font-size:17px; font-weight:900; padding:19px 42px; border-radius:999px; background:var(--vivid);
    color:var(--black); letter-spacing:-.035em;
    transition:background .18s var(--ease), transform .12s var(--ease);}
  #btn-run:hover:not(:disabled){background:var(--vivid-press);}
  #btn-run:active:not(:disabled){background:var(--vivid-press); transform:scale(.97);}
  #btn-run:disabled{opacity:.4; cursor:not-allowed;}
  #run-state{font-size:22px; font-weight:900; color:var(--text); letter-spacing:-.045em;}

  #toast{position:fixed; bottom:110px; left:50%; transform:translateX(-50%) translateY(16px);
    background:var(--black); color:#fff; border-radius:999px; padding:16px 26px; font-size:14px;
    font-weight:700; opacity:0; transition:opacity .28s var(--ease), transform .28s var(--ease);
    z-index:120; pointer-events:none; box-shadow:0 14px 44px rgba(17,20,19,.3);
    max-width:560px; line-height:1.55;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:#cdd3cb; border-radius:8px; border:3px solid transparent; background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#b4bbb2; background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important; scroll-behavior:auto !important;
    }
    .node{animation:none !important; opacity:1 !important;}
    .node:hover .box, .node:active .box, .btn:active, .tog:active, .drop:active,
    #btn-run:active, #s-close:active, .filelist a:active{transform:none !important;}
    .edge.running{stroke-dasharray:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎬</div>
  <div>
    <div class="title">Shorts 제작</div>
    <div class="sub">제품 정보만 넣으면 6단계로 자동 제작됩니다</div>
  </div>
  <div class="hchips">
    <span class="hchip" id="chip-server"><i class="dot"></i>서버 확인 중…</span>
    <span class="hchip" id="chip-gpt"><i class="dot"></i>대본 엔진 확인 중…</span>
    <span class="hchip" id="chip-vb"><i class="dot"></i>음성 확인 중…</span>
  </div>
</header>

<main>
  <div id="canvas-wrap">
    <div id="canvas">
      <svg id="edges" aria-hidden="true">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
                  orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b9beba"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
          <marker id="arrow-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
                  orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#00d55e"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
        </defs>
      </svg>
      <div id="nodes"></div>
    </div>
    <div id="cv-ctl">
      <button id="cv-out" title="축소" aria-label="축소">−</button>
      <button class="zval" id="cv-zoom" tabindex="-1" aria-hidden="true">100%</button>
      <button id="cv-in" title="확대" aria-label="확대">+</button>
      <button id="cv-fit" title="맞춤" aria-label="화면에 맞추기">⤢</button>
    </div>
    <div id="cv-hint">배경 드래그로 이동 · 휠로 확대/축소</div>

    <button id="log-toggle" aria-expanded="false" aria-controls="log-list">

<div id="runbar">
  <button id="btn-run" class="btn-primary">제작 시작</button>
  <span id="run-state">대기 중</span>

<aside id="side" role="dialog" aria-modal="true" aria-labelledby="s-name">
  <div id="s-head">
    <div id="s-icon">①</div>
    <div style="min-width:0">
      <div id="s-name">제품 정보</div>
      <span id="s-status">대기</span>
    </div>
    <button id="s-close" title="닫기" aria-label="닫기">✕</button>
  </div>
  <div id="s-body"></div>
</aside>

<div id="toast"></div>

<input type="file" id="file-input" accept=".png,.jpg,.jpeg,.webp" style="display:none">

<script>
'use strict';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ══ 6단계 정의 (표시 단계 → 서버 노드) ══
   x,y = 캔버스 고정 좌표(노드 박스 좌상단), tile = 아이콘 타일 배경색 */
const STEPS = [
  {id:'s1', num:'①', ic:'⚡', nm:'제품 정보',      nodes:['trigger'],
   x:60,  y:150, tile:'#fff0d6', trigger:true},
  {id:'s2', num:'②', ic:'✍️', nm:'AI 대본 생성',   nodes:['script','quality'], step:'script',
   x:250, y:90,  tile:'#e6ecff'},
  {id:'s3', num:'③', ic:'🔊', nm:'TTS 음성 생성',  nodes:['tts'], step:'tts',
   x:440, y:150, tile:'#e3f6e8'},
  {id:'s4', num:'④', ic:'🎥', nm:'영상 제작',      nodes:['higgsfield'], sub:'Higgsfield · 옵션',
   step:'higgsfield', x:630, y:90,  tile:'#f4e6ff'},
  {id:'s5', num:'⑤', ic:'🎞️', nm:'렌더링',         nodes:['subtitle','render'], sub:'moviepy · 옵션',
   step:'render', x:820, y:150, tile:'#ffe6ea'},
  {id:'s6', num:'⑥', ic:'🚀', nm:'SNS 업로드 준비', nodes:['uptext','yt','tiktok','merge','discard','notify'],
   step:'uptext', sub:'시뮬레이션', x:1010, y:90, tile:'#fff0d6'}
];
const NW = 96, NH = 96;   /* 노드 박스 크기 */

/* 의존 서브노드 (ref 7) — parent 단계 아래 점선으로 매달림 */
const DEPS = [
  {parent:'s2', ic:'⊙', nm:'OpenAI GPT', role:'Model',  key:'gpt_available',       dx:-46},
  {parent:'s3', ic:'⊙', nm:'Voicebox',   role:'우선',    key:'voicebox_available',  dx:-70},
  {parent:'s3', ic:'⊙', nm:'Edge TTS',   role:'폴백',    key:'_always',             dx:26},
  {parent:'s4', ic:'⊙', nm:'Higgsfield API', role:'API', key:'higgsfield_available', dx:-46}
];
const DEP_DY = 150;       /* 부모 박스 하단 → 서브노드 원 상단 거리 */
const health = {};        /* /api/health 응답 캐시 — 서브노드 상태 도트 */

/* 노드별 런타임: {status, items, files, note} */
const nodeState = {};
STEPS.forEach(function(s){ s.nodes.forEach(function(n){ nodeState[n] = null; }); });

const nodesAnimated = {};   /* 노드별 등장 애니메이션 1회 적용 여부 (재렌더 시 깜빡임 방지) */
let running = false, imageId = '', imageName = '', engine = 'template';
let openStep = null, uptextCache = null, lastRunId = '';
let canRerun = false;      /* 전체 실행이 done(ok)된 뒤에만 개별 실행 가능 */
let stepRunning = '';      /* 개별 실행 중인 단계 id ('' = 없음) */
const form = {name:'', category:'', features:''};
const opts = {tts:true, higgsfield:false, render:false, voice:'ko-KR-SunHiNeural', rate:'+0%'};

/* ══ 단계 상태 도출 ══ */
function stepStatus(step){
  const st = step.nodes.map(function(n){ return nodeState[n] && nodeState[n].status; })
                       .filter(Boolean);
  if(!st.length) return 'idle';
  if(st.indexOf('running') >= 0) return 'running';
  if(st.indexOf('error') >= 0) return 'error';
  if(st.indexOf('success') >= 0 || st.indexOf('simulated') >= 0) return 'done';
  if(st.every(function(x){ return x === 'skipped'; })) return 'skipped';
  return 'idle';
}
const LABEL = {idle:'대기', running:'진행 중', done:'완료', error:'실패', skipped:'건너뜀'};

/* 단계에 속한 노드들의 note 중 첫 번째 */
function stepNote(step){
  for(let i = 0; i < step.nodes.length; i++){
    const r = nodeState[step.nodes[i]];
    if(r && r.note) return r.note;
  }
  return '';
}
function nodeFiles(id){ return (nodeState[id] && nodeState[id].files) || []; }
function nodeItems(id){ return (nodeState[id] && nodeState[id].items) || []; }
function allFiles(){
  const out = [];
  Object.keys(nodeState).forEach(function(n){
    nodeFiles(n).forEach(function(f){ out.push(f); });
  });
  return out;
}

/* ══ 노드 캔버스 렌더 ══ */
/* 대본→TTS 엣지 위 "품질 통과 n" 칩 */
function qualityPassCount(){
  const q = nodeItems('quality');
  if(!q.length) return null;
  return q.filter(function(it){ return it.json && it.json.pass; }).length;
}
/* 실행 후 실제 사용된 TTS 엔진 — 서버 tts note 에 엔진명이 포함되어 옴 */
function ttsEngine(){
  const r = nodeState['tts'];
  if(!r || r.status === 'skipped') return '';
  const note = r.note || '';
  if(/미사용/.test(note)) return '';   /* "Voicebox 우선 → Edge TTS 폴백 (둘 다 미사용)" 같은 안내문 제외 */
  if(/voicebox/i.test(note)) return 'Voicebox';
  if(/edge/i.test(note)) return 'Edge TTS';
  return '';
}

/* 좌→우 곡선 베지어 (박스 우측 중앙 → 다음 박스 좌측 중앙) */
function edgePath(a, b){
  const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
  const c = Math.max(40, (x2 - x1) * 0.55);
  return 'M' + x1 + ',' + y1 + ' C' + (x1 + c) + ',' + y1 + ' ' + (x2 - c) + ',' + y2 +
         ' ' + x2 + ',' + y2;
}
/* 부모 박스 하단 중앙 → 서브노드 원 상단 중앙 (점선, 살짝 휘게) */
function depPath(s, d){
  const x1 = s.x + NW / 2, y1 = s.y + NH;
  const x2 = s.x + NW / 2 + d.dx + 28, y2 = s.y + NH + DEP_DY;
  const my = (y1 + y2) / 2;
  return 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + my + ' ' + x2 + ',' + my + ' ' + x2 + ',' + y2;
}

function renderSteps(){
  const svg = $('edges'), nodes = $('nodes');
  /* defs 는 유지하고 path/label 만 갈아끼움 */
  Array.prototype.slice.call(svg.querySelectorAll('path,text')).forEach(function(p){ p.remove(); });
  nodes.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const addPath = function(d, cls){
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d); p.setAttribute('class', cls);
    svg.appendChild(p);
  };

  /* 1) 메인 엣지 */
  STEPS.forEach(function(s, i){
    if(i === 0) return;
    const prev = STEPS[i - 1], pst = stepStatus(prev), cst = stepStatus(s);
    let cls = 'edge';
    if(pst === 'running' || cst === 'running') cls += ' running';
    else if(pst === 'done' || pst === 'skipped') cls += ' done';
    addPath(edgePath(prev, s), cls);
  });

  /* 2) 의존 서브노드 점선 */
  DEPS.forEach(function(d){
    const s = STEPS.filter(function(x){ return x.id === d.parent; })[0];
    const on = d.key === '_always' ? true : !!health[d.key];
    addPath(depPath(s, d), 'dep-edge' + (on ? ' on' : ''));
  });

  /* 3) 메인 노드 */
  STEPS.forEach(function(s, i){
    const st = stepStatus(s);
    const el = document.createElement('div');
    el.className = 'node st-' + st + (openStep === s.id ? ' selected' : '') +
      (nodesAnimated[s.id] ? ' no-anim' : '');
    el.style.left = (s.x - (112 - NW) / 2) + 'px';
    el.style.top = s.y + 'px';
    if(!nodesAnimated[s.id]){
      el.style.animationDelay = (0.02 + i * 0.05) + 's';
      nodesAnimated[s.id] = true;
    }
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', s.nm + ' — ' + LABEL[st]);
    const eng = s.id === 's3' ? ttsEngine() : '';
    const showPlay = !!s.step && canRerun && !!lastRunId;
    el.innerHTML =
      '<div class="box">' + (s.trigger ? '<span class="bolt">⚡</span>' : '') +
        (showPlay ? '<button class="play" type="button" ' +
           'title="이 단계만 다시 실행 (마지막 실행 기반)" aria-label="' + esc(s.nm) +
           ' 단계만 다시 실행">▶</button>' : '') +
        '<div class="tile" style="--tile:' + s.tile + '">' + s.ic + '</div></div>' +
      '<div class="nm">' + esc(s.nm) + '</div>' +
      (s.sub ? '<div class="sub">' + esc(s.sub) + '</div>' : '') +
      (eng ? '<div class="engine">' + esc(eng) + '</div>' : '') +
      '<span class="chip">' + LABEL[st] + '</span>';
    if(showPlay){
      el.querySelector('.play').onclick = function(ev){
        ev.stopPropagation();
        runStep(s);
      };
    }
    el.onclick = function(){ openSide(s.id); };
    el.onkeydown = function(ev){
      if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); openSide(s.id); }
    };
    nodes.appendChild(el);
  });

  /* 4) 서브노드 */
  DEPS.forEach(function(d){
    const s = STEPS.filter(function(x){ return x.id === d.parent; })[0];
    const on = d.key === '_always' ? true : !!health[d.key];
    const el = document.createElement('div');
    el.className = 'dep ' + (on ? 'on' : 'off');
    el.style.left = (s.x + NW / 2 + d.dx - 20) + 'px';
    el.style.top = (s.y + NH + DEP_DY) + 'px';
    el.title = d.nm + ' — ' + (on ? '연결됨' : '꺼짐');
    el.innerHTML =
      '<div class="circ">' + d.ic + '<span class="sdot"></span></div>' +
      '<div class="dnm">' + esc(d.nm) + '</div>' +
      '<div class="drole">' + esc(d.role) + '</div>';
    nodes.appendChild(el);
  });

  /* 5) 엣지 라벨 — 대본→TTS 구간의 품질 통과 수 */
  const pass = qualityPassCount();
  if(pass != null){
    const a = STEPS[1], b = STEPS[2];
    const lab = document.createElement('div');
    lab.className = 'elabel' + (pass > 0 ? ' ok' : '');
    lab.style.left = ((a.x + NW + b.x) / 2) + 'px';
    lab.style.top = ((a.y + b.y) / 2 + NH / 2 - 16) + 'px';
    lab.textContent = '품질 통과 ' + pass;
    nodes.appendChild(lab);
  }
}

/* ══ 팬 · 줌 ══ */
const view = {x:30, y:20, k:1};
let viewTouched = false;   /* 사용자가 팬/줌한 뒤로는 리사이즈가 화면을 되돌리지 않게 */
function applyView(){
  $('canvas').style.transform =
    'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
  $('cv-zoom').textContent = Math.round(view.k * 100) + '%';
}
function zoomAt(k, cx, cy){
  const nk = Math.min(1.6, Math.max(0.5, k));
  view.x = cx - (cx - view.x) * (nk / view.k);
  view.y = cy - (cy - view.y) * (nk / view.k);
  view.k = nk;
  viewTouched = true;
  applyView();
}
(function initPanZoom(){
  const wrap = $('canvas-wrap');
  let drag = null;
  wrap.addEventListener('pointerdown', function(e){
    if(e.target.closest('.node, .dep, #cv-ctl')) return;   /* 노드 클릭은 그대로 */
    drag = {px:e.clientX, py:e.clientY};
    wrap.classList.add('panning');
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', function(e){
    if(!drag) return;
    view.x += e.clientX - drag.px; view.y += e.clientY - drag.py;
    drag.px = e.clientX; drag.py = e.clientY;
    viewTouched = true;
    applyView();
  });
  const end = function(){ drag = null; wrap.classList.remove('panning'); };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
  wrap.addEventListener('wheel', function(e){
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    zoomAt(view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX - r.left, e.clientY - r.top);
  }, {passive:false});
  $('cv-in').onclick = function(){ const r = wrap.getBoundingClientRect();
    zoomAt(view.k * 1.15, r.width / 2, r.height / 2); };
  $('cv-out').onclick = function(){ const r = wrap.getBoundingClientRect();
    zoomAt(view.k / 1.15, r.width / 2, r.height / 2); };
  $('cv-fit').onclick = function(){ fitView(); };
  window.addEventListener('resize', function(){ if(!viewTouched) fitView(); });
})();
function fitView(){
  viewTouched = false;
  const wrap = $('canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const cw = 1180, ch = 420;                       /* 노드 전체 바운딩 박스(대략) */
  view.k = Math.min(1.6, Math.max(0.5, Math.min((w - 40) / cw, (h - 40) / ch)));
  view.x = (w - cw * view.k) / 2;
  view.y = 18;
  applyView();
}

/* ══ 로그 · 토스트 ══ */
function log(cls, msg){
  const d = document.createElement('div');
  d.className = 'log-line ' + cls;
  d.textContent = msg;
  $('log-list').appendChild(d);
  $('log-list').scrollTop = $('log-list').scrollHeight;
}
let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 4200);
}
$('log-toggle').onclick = function(){
  const open = $('logbox').classList.toggle('open');
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
};
function fmtSize(n){
  // 서버 files[].size 는 이미 "2837.8 KB" 형식의 문자열 — 그대로 표시
  return n == null ? '' : n;
}

/* ══ 사이드바 ══ */
function openSide(id){
  openStep = id;
  const s = STEPS.filter(function(x){ return x.id === id; })[0];
  const st = stepStatus(s);
  $('s-icon').textContent = s.num;
  $('s-name').textContent = s.nm;
  $('s-status').textContent = LABEL[st];
  $('s-status').className = 'st-' + st;
  $('s-body').innerHTML = '';
  const note = stepNote(s);
  if(note && (st === 'error' || st === 'skipped')){
    const n = document.createElement('div');
    n.className = 'note' + (st === 'error' ? ' err' : '');
    n.textContent = note;
    $('s-body').appendChild(n);
  }
  BODY[id](s, $('s-body'));
  $('side').classList.add('open');
  $('scrim').classList.add('open');
  renderSteps();
}
function closeSide(){
  openStep = null;
  $('side').classList.remove('open');
  $('scrim').classList.remove('open');
  renderSteps();
}
$('s-close').onclick = closeSide;
$('scrim').onclick = closeSide;
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && openStep) closeSide();
});

function h(html){ const d = document.createElement('div'); d.innerHTML = html; return d; }

function mediaFor(nodes, kind, match){
  const out = [];
  nodes.forEach(function(n){
    nodeFiles(n).forEach(function(f){
      if(match.test(f.name)) out.push('<' + kind + ' controls preload="metadata" src="' + esc(f.url) + '"></' + kind + '>');
    });
  });
  return out.join('');
}

const BODY = {};

/* ① 제품 정보 */
BODY.s1 = function(step, body){
  body.appendChild(h(
    '<div class="sec-t">제품</div>' +
    '<div class="fld"><label for="f-name">제품명 (필수)</label>' +
      '<input id="f-name" placeholder="예: 무선 이어폰 X1" value="' + esc(form.name) + '"></div>' +
    '<div class="fld"><label for="f-cat">카테고리</label>' +
      '<input id="f-cat" placeholder="예: 전자기기" value="' + esc(form.category) + '"></div>' +
    '<div class="fld"><label for="f-feat">특징</label>' +
      '<textarea id="f-feat" placeholder="핵심 장점을 자유롭게 적어주세요">' + esc(form.features) + '</textarea></div>' +
    '<div class="sec-t">제품 이미지 (선택)</div>' +
    '<button class="drop' + (imageId ? ' has' : '') + '" id="drop">' +
      (imageId ? '✓ ' + esc(imageName) : '클릭해서 이미지 선택 (png · jpg · webp)') + '</button>'
  ));
  $('f-name').oninput = function(){ form.name = this.value; };
  $('f-cat').oninput = function(){ form.category = this.value; };
  $('f-feat').oninput = function(){ form.features = this.value; };
  $('drop').onclick = function(){ $('file-input').click(); };
};

/* ② AI 대본 */
BODY.s2 = function(step, body){
  body.appendChild(h('<div class="note">GPT가 대본을 자동으로 만듭니다. API를 쓸 수 없으면 기본 템플릿으로 대체됩니다.</div>'));
  const items = nodeItems('script');
  if(items.length){
    let html = '<div class="sec-t">생성된 대본</div>';
    items.forEach(function(it){
      const j = it.json || {};
      html += '<div class="item-tag">' + esc(j.product_name || '') +
        (j.script_source ? ' · ' + esc(j.script_source) : '') + '</div>' +
        '<div class="scriptbox">' + esc(j.script || '(대본 없음)') + '</div>';
    });
    body.appendChild(h(html));
  }
  const q = nodeItems('quality');
  if(q.length){
    let html = '<div class="sec-t">품질 검사</div>';
    q.forEach(function(it){
      const j = it.json || {};
      html += '<div class="item-tag">' + esc(j.product_name || '') +
        '<span class="pill ' + (j.pass ? 'ok">통과' : 'no">탈락') + '</span></div>';
      if(j.quality) html += '<div class="note">' + esc(j.quality) + '</div>';
    });
    body.appendChild(h(html));
  }
  if(!items.length && !q.length) body.appendChild(h('<div class="empty">제작을 시작하면 대본이 여기에 표시됩니다.</div>'));
};

/* 공통 토글 위젯 */
function addToggle(body, key, title, desc, disabled, disabledNote){
  const wrap = h(
    '<label class="tog' + (disabled ? ' disabled' : '') + '">' +
      '<input type="checkbox"' + (opts[key] ? ' checked' : '') + (disabled ? ' disabled' : '') + '>' +
      '<div><div class="tt">' + esc(title) + '</div><div class="td">' + esc(desc) + '</div></div>' +
    '</label>' + (disabled && disabledNote ? '<div class="note">' + esc(disabledNote) + '</div>' : '')
  );
  body.appendChild(wrap);
  wrap.querySelector('input').onchange = function(){ opts[key] = this.checked; };
}

/* ③ TTS */
BODY.s3 = function(step, body){
  addToggle(body, 'tts', 'TTS 음성 생성', '대본을 읽어주는 mp3를 만듭니다', false);
  body.appendChild(h(
    '<div class="fld"><label for="f-voice">목소리</label><select id="f-voice">' +
      '<option value="ko-KR-SunHiNeural">여성 (SunHi)</option>' +
      '<option value="ko-KR-InJoonNeural">남성 (InJoon)</option></select></div>' +
    '<div class="fld"><label for="f-rate">말하기 속도</label><select id="f-rate">' +
      '<option value="-10%">느리게 (-10%)</option>' +
      '<option value="+0%">보통 (+0%)</option>' +
      '<option value="+10%">빠르게 (+10%)</option></select></div>'
  ));
  $('f-voice').value = opts.voice;
  $('f-rate').value = opts.rate;

  $('f-rate').onchange = function(){ opts.rate = this.value; };

};

  body.appendChild(h('<div class="warn-box"><b>실비 발생</b> — 클립 1개당 약 <b>9크레딧</b>이 차감됩니다.</div>'));

/* ⑤ 렌더링 */
BODY.s5 = function(step, body){
  addToggle(body, 'render', '초안 영상 만들기', '자막을 합친 mp4 초안 — 수십 초 걸립니다', false);
  const vid = mediaFor(['render'], 'video', /\.mp4$/i);

/* ⑥ SNS 업로드 준비 */
BODY.s6 = function(step, body){
  const upFiles = nodeFiles('uptext').filter(function(f){ return /\.txt$/i.test(f.name); });
  if(upFiles.length){
    body.appendChild(h('<div class="sec-t">업로드 문구</div>'));
    const box = h('<div class="scriptbox" id="uptext-box">불러오는 중…</div>' +
      '<button class="btn btn-full" id="btn-copy">복사</button>');
    body.appendChild(box);
    const setText = function(txt){
      uptextCache = txt;
      $('uptext-box').textContent = txt;
    };
    if(uptextCache != null) setText(uptextCache);
    else fetch(upFiles[0].url).then(function(r){ return r.text(); })
      .then(setText)
      .catch(function(){ $('uptext-box').textContent = '(문구를 불러오지 못했습니다)'; });
    $('btn-copy').onclick = function(){
      const txt = uptextCache || '';
      if(!txt) return;
      navigator.clipboard.writeText(txt)
        .then(function(){ toast('업로드 문구를 복사했습니다'); })
        .catch(function(){ toast('복사에 실패했습니다 — 직접 선택해 복사해 주세요'); });
    };
  }
  const files = allFiles();
  body.appendChild(h('<div class="sec-t">산출물 파일 (' + files.length + ')</div>'));
  if(files.length){
    let html = '<div class="filelist">';
    files.forEach(function(f){
      html += '<a href="' + esc(f.url) + '" download>' + esc(f.name) +
        '<span class="sz">' + fmtSize(f.size) + '</span></a>';
    });
    body.appendChild(h(html + '</div>'));
  } else {
    body.appendChild(h('<div class="empty">제작이 끝나면 결과 파일이 여기에 표시됩니다.</div>'));
  }
  if(lastRunId){
    const b = h('<button class="btn btn-full" id="btn-folder" style="margin-top:10px">산출물 폴더 열기</button>');
    body.appendChild(b);
    $('btn-folder').onclick = function(){
      fetch('/api/open-folder', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({run_id: lastRunId})
      }).then(function(r){ return r.json(); })
        .then(function(j){ toast(j.ok ? '탐색기를 열었습니다' : ('폴더를 열지 못했습니다: ' + (j.error || ''))); })
        .catch(function(){ toast('폴더를 열지 못했습니다'); });
    };
  }
};

/* ══ 이미지 업로드 ══ */
$('file-input').onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!/\.(png|jpe?g|webp)$/i.test(file.name)){
    toast('png · jpg · webp 파일만 올릴 수 있습니다');
    this.value = '';
    return;
  }
  const drop = $('drop');
  if(drop) drop.textContent = '업로드 중…';
  fetch('/api/upload-image?name=' + encodeURIComponent(file.name), {method:'POST', body:file})
    .then(function(res){ return res.json().then(function(j){ return {ok:res.ok, status:res.status, j:j}; }); })
    .then(function(r){
      if(!r.ok || !r.j.image_id) throw new Error(r.j.error || ('HTTP ' + r.status));
      imageId = r.j.image_id;
      imageName = file.name;
      toast('이미지를 올렸습니다: ' + file.name);
      if(openStep) openSide(openStep);
    })
    .catch(function(err){
      imageId = ''; imageName = '';
      toast('이미지 업로드 실패: ' + err.message);
      if(openStep) openSide(openStep);
    });
  this.value = '';
};

/* ══ 실행 ══ */
function setRunState(txt){ $('run-state').textContent = txt; }

$('btn-run').onclick = function(){
  if(running) return;
  if(!form.name.trim()){
    openSide('s1');
    setTimeout(function(){ const el = $('f-name'); if(el) el.focus(); }, 320);
    toast('제품명을 입력해 주세요');
    return;
  }
  if(opts.higgsfield && !imageId){
    opts.higgsfield = false;
    toast('제품 이미지가 없어 영상 제작을 껐습니다');
  }

  /* 상태 초기화 */
  Object.keys(nodeState).forEach(function(n){ nodeState[n] = null; });
  uptextCache = null; lastRunId = ''; canRerun = false; stepRunning = '';
  $('log-list').innerHTML = '';
  running = true;
  $('btn-run').disabled = true;
  setRunState('실행 중…');
  renderSteps();
  if(openStep) openSide(openStep);
  log('log-info', '━━ 제작 시작 · 엔진 ' + engine + (opts.higgsfield ? ' · 영상 ON' : '') + ' ━━');

  fetch('/api/run', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      products: [{
        product_name: form.name.trim(),
        category: form.category.trim(),
        features: form.features.trim()
      }],
      options: {
        engine: engine,
        tts: opts.tts,
        render: opts.render,
        higgsfield: opts.higgsfield,
        voice: opts.voice,
        rate: opts.rate,
        image_id: imageId || ''
      }
    })
  })
  .then(function(res){ return res.json().then(function(j){ return {ok:res.ok, status:res.status, j:j}; }); })
  .then(function(r){
    if(!r.ok || !r.j.run_id) throw new Error(r.j.error || ('HTTP ' + r.status));
    lastRunId = r.j.run_id;
    listenSSE(r.j.run_id);
  })
  .catch(function(err){
    log('log-err', '✕ 실행 요청 실패: ' + err.message);
    setRunState('실패');
    running = false;
    $('btn-run').disabled = false;
    toast('실행 요청 실패 — 서버가 켜져 있는지 확인하세요 (' + err.message + ')');
  });
};

/* ══ 단계 개별 실행 (n8n Execute node) ══ */
const STEP_LABEL = {script:'대본', tts:'TTS', higgsfield:'영상 제작', render:'렌더링', uptext:'SNS 준비'};
/* 단계별로 서버에 보낼 옵션 — 사이드바의 현재 값 그대로 */
function stepOptions(step){
  if(step === 'script') return {engine: engine};
  if(step === 'tts') return {tts: true, voice: opts.voice, rate: opts.rate};
  if(step === 'higgsfield') return {higgsfield: true, image_id: imageId || ''};
  if(step === 'render') return {render: true};
  return {};
}

function runStep(s){
  if(running || stepRunning) return;
  if(!lastRunId || !canRerun){ toast('먼저 전체 제작을 한 번 실행해 주세요'); return; }
  if(s.step === 'higgsfield' && !imageId){
    toast('제품 이미지를 먼저 올려주세요 (① 제품 정보)');
    return;
  }
  if(s.step === 'uptext') uptextCache = null;   /* 문구가 바뀌므로 캐시 무효화 */
  stepRunning = s.id;
  running = true;
  $('btn-run').disabled = true;
  setRunState(STEP_LABEL[s.step] + ' 재실행 중…');
  /* 해당 단계 노드만 running 으로, 나머지 상태는 유지 */
  s.nodes.forEach(function(n){
    if(n in nodeState) nodeState[n] = {status:'running', items:[], files:[], note:''};
  });
  renderSteps();
  if(openStep) openSide(openStep);
  log('log-info', '━━ [' + STEP_LABEL[s.step] + '] 단계만 재실행 ━━');

  fetch('/api/run-step', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({base_run_id: lastRunId, step: s.step, options: stepOptions(s.step)})
  })
  .then(function(res){ return res.json().then(function(j){ return {ok:res.ok, status:res.status, j:j}; }); })
  .then(function(r){
    if(!r.ok || !r.j.run_id) throw new Error(r.j.error || ('HTTP ' + r.status));
    listenSSE(r.j.run_id, s);
  })
  .catch(function(err){
    log('log-err', '✕ 단계 재실행 요청 실패: ' + err.message);
    endStepRun('실패');
    toast('단계 재실행 실패: ' + err.message);
  });
}

function endStepRun(stateTxt){
  stepRunning = '';
  running = false;
  $('btn-run').disabled = false;
  setRunState(stateTxt);
  renderSteps();
  if(openStep) openSide(openStep);
}

function listenSSE(runId, stepCtx){
  const es = new EventSource('/api/events/' + runId);
  es.onmessage = function(ev){
    let e;
    try { e = JSON.parse(ev.data); } catch(_){ return; }

    if(e.type === 'log'){
      const cls = {ok:'log-ok', err:'log-err', warn:'log-warn', info:'log-info'}[e.level] || 'log-line';
      log(cls, e.msg);
    }

    if(e.type === 'node'){
      if(!(e.node in nodeState)) return;   /* 6단계에 매핑되지 않은 노드는 무시 */
      nodeState[e.node] = {
        status: e.status,
        items: e.items || (nodeState[e.node] && nodeState[e.node].items) || [],
        files: e.files || (nodeState[e.node] && nodeState[e.node].files) || [],
        note: e.note || ''
      };
      renderSteps();
      if(openStep) openSide(openStep);
    }

    if(e.type === 'done'){
      es.close();
      const s = e.summary || {};
      if(s.run_id) lastRunId = s.run_id;
      if(stepCtx){
        if(e.ok){
          endStepRun('완료 ' + (s.elapsed_sec != null ? s.elapsed_sec + 's' : ''));
          toast(STEP_LABEL[stepCtx.step] + ' 재실행 완료');
        } else {
          endStepRun('실패');
          toast('단계 재실행 실패 — 로그를 확인하세요' + (e.error ? ': ' + e.error : ''));
        }
        return;
      }
      running = false;
      $('btn-run').disabled = false;
      if(e.ok){
        canRerun = true;
        setRunState('완료 ' + (s.elapsed_sec != null ? s.elapsed_sec + 's' : ''));
        toast('제작 완료 — ⑥ SNS 업로드 준비에서 결과를 확인하세요');
        renderSteps();
        openSide('s6');
      } else {
        setRunState('실패');
        toast('제작 실패 — 자세한 로그를 확인하세요' + (e.error ? ': ' + e.error : ''));
        renderSteps();
      }
    }
  };
  es.onerror = function(){
    es.close();
    if(running){
      log('log-err', '✕ 이벤트 스트림이 끊겼습니다');
      if(stepCtx) endStepRun('연결 끊김');
      else {
        running = false;
        $('btn-run').disabled = false;
        setRunState('연결 끊김');
      }
    }
  };
}

/* ══ 서버 상태 ══ */
function setChip(el, on, txt){
  el.className = 'hchip ' + (on ? 'on' : 'off');
  el.innerHTML = '<i class="dot"></i>' + esc(txt);
}

    setChip($('chip-server'), false, '서버 응답 없음');
    setChip($('chip-gpt'), false, '대본 엔진 확인 불가');
    setChip($('chip-vb'), false, '음성 확인 불가');
  });

fitView();
renderSteps();
